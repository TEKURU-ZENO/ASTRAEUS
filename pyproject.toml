[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astraeus"
version = "0.1.0"
description = "Autonomous Computational Universe & Scientific Intelligence Ecosystem"
authors = [
    {name = "ASTRAEUS Research Consortium"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.1.0",
    "astropy-healpix>=2.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/astraeus-core/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

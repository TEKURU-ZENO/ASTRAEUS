[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astraeus-models"
version = "0.1.0"
description = "Machine learning baselines, feature extraction, and hardware profiling for ASTRAEUS"
authors = [
    {name = "ASTRAEUS Research Consortium"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "astraeus-core>=0.1.0",
    "astraeus-data>=0.1.0",
    "astropy>=6.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "torch>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

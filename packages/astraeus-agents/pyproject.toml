[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astraeus-agents"
version = "0.1.0"
description = "Autonomous Multi-Agent Runtime & Scientific Investigation Architecture for ASTRAEUS"
authors = [
    {name = "ASTRAEUS Research Consortium"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "astraeus-core>=0.1.0",
    "astraeus-data>=0.1.0",
    "astraeus-models>=0.1.0",
    "astraeus-bench>=0.1.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astraeus-knowledge"
version = "0.1.0"
description = "Graph reasoning (Neo4j), vector index (Qdrant), and knowledge fabric for ASTRAEUS"
authors = [
    {name = "ASTRAEUS Research Consortium"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "astraeus-core>=0.1.0",
    "astraeus-data>=0.1.0",
    "neo4j>=5.0.0",
    "qdrant-client>=1.7.0",
    "networkx>=3.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

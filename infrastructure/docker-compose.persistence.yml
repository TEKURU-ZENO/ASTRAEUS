version: '3.8'

services:
  # 1. PostgreSQL 16 Relational Store
  postgres:
    image: postgres:16-alpine
    container_name: astraeus-postgres
    environment:
      POSTGRES_USER: astraeus_user
      POSTGRES_PASSWORD: astraeus_password
      POSTGRES_DB: astraeus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/astraeus-data/src/astraeus_data/storage/migrations/001_initial_schema_postgresql.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astraeus_user -d astraeus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Neo4j 5 Community Graph Database
  neo4j:
    image: neo4j:5.20.0-community
    container_name: astraeus-neo4j
    environment:
      NEO4J_AUTH: neo4j/astraeus_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"  # HTTP Web Browser
      - "7687:7687"  # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "astraeus_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Qdrant Vector Engine
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: astraeus-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. MinIO S3 Object Store
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: astraeus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  minio_data:

name: ASTRAEUS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest scikit-learn lightgbm joblib astropy astropy-healpix pyarrow pydantic numpy scipy pandas
          pip install -e packages/astraeus-core
          pip install -e packages/astraeus-data
          pip install -e packages/astraeus-models
          pip install -e packages/astraeus-agents
          pip install -e packages/astraeus-bench
          pip install -e packages/astraeus-knowledge

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

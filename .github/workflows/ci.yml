name: ASTRAEUS Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install constrained scientific dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "pytest>=8.0.0" "scikit-learn>=1.4.0,<1.9.0" "lightgbm>=4.0.0" "joblib>=1.3.0" "astropy>=6.1.0" "astropy-healpix>=2.0.0" "pyarrow>=15.0.0" "pydantic>=2.6.0" "numpy>=1.26.0,<2.3.0" "scipy>=1.12.0,<1.18.0" "pandas>=2.1.0" "torch>=2.1.0" "qdrant-client>=1.7.0" "networkx>=3.0" "neo4j>=5.0.0"

      - name: Install local monorepo packages (topological order)
        run: |
          pip install --no-deps -e packages/astraeus-core
          pip install --no-deps -e packages/astraeus-data
          pip install --no-deps -e packages/astraeus-models
          pip install --no-deps -e packages/astraeus-bench
          pip install --no-deps -e packages/astraeus-knowledge
          pip install --no-deps -e packages/astraeus-agents

      - name: Verify test collection across all packages
        run: |
          python -m pytest --collect-only

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v --tb=short
